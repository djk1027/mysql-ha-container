name: mysql-ha-container

services:
  mysql-server-1:
    image: mysql:8.4
    container_name: mysql-server-1
    cpus: 2
    mem_limit: 1g
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "127.0.0.1:3376:3306"
    volumes:
      - mysql-server-1-data:/var/lib/mysql
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --relay-log=relay-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --sync-binlog=1
      - --innodb-flush-log-at-trx-commit=1
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -h 127.0.0.1 -uroot -Nse 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-server-2:
    image: mysql:8.4
    container_name: mysql-server-2
    cpus: 2
    mem_limit: 1g
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "127.0.0.1:3377:3306"
    volumes:
      - mysql-server-2-data:/var/lib/mysql
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --relay-log=relay-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --sync-binlog=1
      - --innodb-flush-log-at-trx-commit=1
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -h 127.0.0.1 -uroot -Nse 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-server-3:
    image: mysql:8.4
    container_name: mysql-server-3
    cpus: 2
    mem_limit: 1g
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "127.0.0.1:3378:3306"
    volumes:
      - mysql-server-3-data:/var/lib/mysql
    command:
      - --server-id=3
      - --log-bin=mysql-bin
      - --relay-log=relay-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --sync-binlog=1
      - --innodb-flush-log-at-trx-commit=1
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -h 127.0.0.1 -uroot -Nse 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-server-1-data:
  mysql-server-2-data:
  mysql-server-3-data: