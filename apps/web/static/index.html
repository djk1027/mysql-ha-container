<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MySQL HA Dashboard</title>
  <script>
    // CSS 적용 전에 저장된 테마를 반영해 깜빡임 방지 (기본: dark)
    try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
  </script>
  <!-- 웹폰트: 오프라인이면 시스템 폰트로 대체됨 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">◆</span>
      <h1>MySQL HA</h1>
    </div>
    <div class="meta">
      <span class="pill" id="primary-pill">Primary: -</span>
      <span class="pill" id="conn-pill"><i class="dot"></i><span>연결 중…</span></span>
      <span class="muted" id="updated">-</span>
      <button type="button" class="icon-btn" id="theme-btn" title="라이트 모드로 전환" aria-label="라이트 모드로 전환">
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </g>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" class="icon-btn" id="refresh-btn" title="새로고침" aria-label="새로고침">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section id="restart-banner" class="restart-banner hidden" role="alert">
      ⚠ 대시보드 서버 코드가 변경되었습니다. 서버를 재시작해야 화면이 올바르게 표시됩니다.
      <span class="muted">(<code>./ha.sh restart web</code>)</span>
    </section>

    <section id="issues" class="issues hidden" aria-live="polite"></section>

    <section class="nodes" id="nodes"></section>

    <section class="charts">
      <div class="chart-card">
        <div class="chart-head"><h2>CPU</h2><span class="muted">% (할당 CPU 대비)</span></div>
        <div class="chart" id="chart-cpu"></div>
      </div>
      <div class="chart-card">
        <div class="chart-head"><h2>Memory</h2><span class="muted">% (mem_limit 대비)</span></div>
        <div class="chart" id="chart-mem"></div>
      </div>
      <div class="chart-card">
        <div class="chart-head"><h2>QPS</h2><span class="muted">queries / sec</span></div>
        <div class="chart" id="chart-qps"></div>
      </div>
      <div class="chart-card">
        <div class="chart-head"><h2>Connections</h2><span class="muted">Threads_connected</span></div>
        <div class="chart" id="chart-conn"></div>
      </div>
    </section>

    <section class="events-card">
      <div class="chart-head">
        <h2>실행 중인 SQL <span class="muted" id="proc-count"></span></h2>
        <div class="proc-filters">
          <label>노드
            <select id="proc-node"><option value="">All</option></select>
          </label>
          <label><input type="checkbox" id="proc-sleep"> Sleep 포함</label>
          <label><input type="checkbox" id="proc-system"> 시스템 스레드 포함</label>
        </div>
      </div>
      <div class="table-wrap">
        <table class="proc" id="proc-table">
          <colgroup id="proc-cols"></colgroup>
          <thead><tr id="proc-head"></tr></thead>
          <tbody id="proc-body"><tr><td colspan="9" class="muted">데이터 수집 중…</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="events-card">
      <div class="chart-head"><h2>이벤트</h2><span class="muted">최근 50건</span></div>
      <ol class="events" id="events"><li class="muted">이벤트 없음</li></ol>
    </section>
  </main>

  <dialog id="sql-dialog" class="sql-dialog" aria-labelledby="sql-dialog-title">
    <div class="dialog-body">
    <div class="dialog-head">
      <h2 id="sql-dialog-title">SQL 상세</h2>
      <button type="button" class="icon-btn" data-action="close" aria-label="닫기">✕</button>
    </div>
    <dl class="dialog-meta" id="sql-meta"></dl>
    <p class="dialog-note" id="sql-note" hidden></p>
    <pre class="dialog-sql" id="sql-text"></pre>
    <div class="dialog-actions">
      <span class="muted" id="sql-copied"></span>
      <button type="button" class="btn" data-action="copy">복사</button>
      <button type="button" class="btn primary" data-action="close">닫기</button>
    </div>
    </div>
  </dialog>

  <script src="/static/processlist.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
